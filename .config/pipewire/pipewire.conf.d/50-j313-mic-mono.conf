# asahi-audio labels the processed J313 mic channel AUX0 (/usr/share/asahi-audio/j313/mic.json),
# so stereo recorders (wf-recorder, OBS) get it on the left channel only. Re-expose it as a
# MONO source, which PipeWire copies to both channels. The capture side is passive, so the
# mic only runs while something records from this source.
context.modules = [
    {   name = libpipewire-module-loopback
        args = {
            node.description = "MacBook Air Microphone (mono)"
            capture.props = {
                node.name = "j313-mic-mono.capture"
                target.object = "effect_output.j313-mic"
                audio.position = [ AUX0 ]
                stream.dont-remix = true
                node.passive = true
            }
            playback.props = {
                node.name = "j313-mic-mono"
                media.class = "Audio/Source"
                audio.position = [ MONO ]
            }
        }
    }
]
